services:
  streamer:
    image: ghcr.io/benjithatfoxguy/spotify-connect-streamer:main
    container_name: spotify-streamer
    restart: unless-stopped
    network_mode: host
    volumes:
      - spot-cache:/tmp/spot-cache
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      DEVICE_NAME: "${DEVICE_NAME:-Stream Output}"
      DEVICE_TYPE: "${DEVICE_TYPE:-speaker}"
      MOUNT_POINT: "${MOUNT_POINT:-stream.mp3}"
      ICECAST_HOST: "${ICECAST_HOST:-icecast}"
      ICECAST_PORT: "${ICECAST_PORT:-8000}"
      ICECAST_SOURCE_USERNAME: "${ICECAST_SOURCE_USERNAME:-source}"
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-hackme}"
      ICECAST_ADMIN_USER: "${ICECAST_ADMIN_USER:-admin}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-}"
      CACHE_DIR: "/tmp/spot-cache"
      BACKEND: "${BACKEND:-pipe-pv}"
      MP3_BITRATE: "${MP3_BITRATE:-320k}"
      AUTH_MODE: "${AUTH_MODE:-}"
      OAUTH_PORT: "${OAUTH_PORT:-8888}"
      LIBRESPOT_EXTRA_ARGS: "${LIBRESPOT_EXTRA_ARGS:-}"
      SPOTIFY_USERNAME: "${SPOTIFY_USERNAME:-}"
      SPOTIFY_PASSWORD: "${SPOTIFY_PASSWORD:-}"
      DISABLE_DISCOVERY: "${DISABLE_DISCOVERY:-false}"

volumes:
  spot-cache:
