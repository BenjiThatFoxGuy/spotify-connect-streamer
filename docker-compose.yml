services:
  icecast:
    image: infiniteproject/icecast
    container_name: spotify-streamer-icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-hackme}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-hackme}"
      ICECAST_RELAY_PASSWORD: "${ICECAST_RELAY_PASSWORD:-hackme}"
      ICECAST_MAX_CLIENTS: "100"
      ICECAST_MAX_SOURCES: "2"

  streamer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-streamer
    restart: unless-stopped
    depends_on:
      - icecast
    # Zeroconf (LAN) discovery needs to see the real network to be found by
    # the Spotify app, so we run this service on the host network instead of
    # the default bridge.
    network_mode: host
    volumes:
      - spot-cache:/tmp/spot-cache
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      DEVICE_NAME: "${DEVICE_NAME:-Stream Output}"
      DEVICE_TYPE: "${DEVICE_TYPE:-speaker}"
      MOUNT_POINT: "${MOUNT_POINT:-stream.mp3}"
      ICECAST_HOST: "${ICECAST_HOST:-localhost}"
      ICECAST_PORT: "${ICECAST_PORT:-8000}"
      ICECAST_SOURCE_USERNAME: "${ICECAST_SOURCE_USERNAME:-source}"
      ICECAST_SOURCE_PASSWORD: "${ICECAST_SOURCE_PASSWORD:-hackme}"
      ICECAST_ADMIN_USER: "${ICECAST_ADMIN_USER:-admin}"
      ICECAST_ADMIN_PASSWORD: "${ICECAST_ADMIN_PASSWORD:-${ICECAST_SOURCE_PASSWORD:-hackme}}"
      CACHE_DIR: "/tmp/spot-cache"
      MP3_BITRATE: "${MP3_BITRATE:-320k}"
      GO_LIBRESPOT_API_HOST: "${GO_LIBRESPOT_API_HOST:-127.0.0.1}"
      GO_LIBRESPOT_API_BIND_ADDRESS: "${GO_LIBRESPOT_API_BIND_ADDRESS:-0.0.0.0}"
      GO_LIBRESPOT_API_PORT: "${GO_LIBRESPOT_API_PORT:-3678}"
      GO_LIBRESPOT_ZEROCONF_BACKEND: "${GO_LIBRESPOT_ZEROCONF_BACKEND:-builtin}"
      AUTH_MODE: "${AUTH_MODE:-}"
      OAUTH_PORT: "${OAUTH_PORT:-8888}"
      DISABLE_DISCOVERY: "${DISABLE_DISCOVERY:-false}"

volumes:
  spot-cache:
